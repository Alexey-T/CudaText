; INI File Syntax Example

; This is a comment.
; Comments start with a semicolon (;) or a hash (#).
# Another way to comment.

[Database]
; Database connection settings
Type=MySQL
Host=localhost
Port=3306
User=admin
Password=secure_password123
DatabaseName=my_application_db
TimeoutSeconds=30 ; Inline comment

[ApplicationSettings]
; General application configuration
AppName=MyAwesomeApp
Version=1.0.5
DebugMode=true ; Boolean value (often parsed as 1/0, true/false)
LogLevel=INFO
MaxConnections=100

; Values can contain spaces, but leading/trailing spaces might be trimmed by parsers.
WelcomeMessage = Hello, World!

; Paths
LogDirectory=/var/log/my_app
ConfigFile=./config/app.conf

[UserPreferences]
Theme=dark
FontSize=12
EnableNotifications=yes ; Another way to represent boolean
LastOpenedFile=C:\Users\JohnDoe\Documents\report.txt

; Values can be empty
EmptyValue=

; Keys can be simple.
DefaultBrowser=
Homepage=https://www.example.com

[Network]
; Network specific settings
Protocol=HTTPS
Port=443
EnableProxy=no
ProxyAddress=

[Misc]
; Miscellaneous settings
LastRunDate=2025-07-08
ProcessingDelayMs=500