// Sample protobuf for lexer benchmarking
syntax = "proto3";

package bench.v1;

import "google/protobuf/timestamp.proto";

option go_package = "example.com/bench/v1;benchv1";

enum Quality {
  QUALITY_UNSPECIFIED = 0;
  QUALITY_LOW = 1;
  QUALITY_HIGH = 64;
}

message Entry {
  string name = 1;
  double weight = 2;
  Quality quality = 3;
  repeated string tags = 4;
  map<string, int64> meta = 5;
  google.protobuf.Timestamp created_at = 6;
}

