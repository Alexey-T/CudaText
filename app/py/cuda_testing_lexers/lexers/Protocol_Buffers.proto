  bool active = 3;
  Entry entry = 4;
}

// generated Msg_5436
message Msg_5436 {
  uint32 id = 1;
  string label = 2;
  bool active = 3;
  Entry entry = 4;
}

// generated Msg_6572
message Msg_6572 {
  uint32 id = 1;
  string label = 2;
  bool active = 3;
  Entry entry = 4;
}

// generated Msg_5199
message Msg_5199 {
